# Copy to config.ini (same folder) and fill in.
host = 192.168.1.10
user = yourname
# domain = WORKGROUP

# Needed for the first connection only. After a successful login KindleRDP stores it
# encrypted in /var/local/kindlerdp (not visible over USB) and blanks this line.
password =

# port = 3389
# Windows display scaling in percent. 200 suits the 300 dpi panel.
# scale = 200
# Waveform for screen changes. GL16 (default) and REAGL show 16 grays, about 0.45 s per update.
# AUTO lets the panel pick per area. DU4 (4 grays), DU and A2 (black/white) are faster but
# rougher; DU and A2 get a 16-gray cleanup once the area stops changing.
# fast_waveform = GL16
# Above 1 darkens mid-grays, so pale Windows borders and text stay visible (0.5-3.0).
# gamma = 1.0
# Full path of the fbink tool if it is not found automatically.
# fbink = /mnt/us/libkh/bin/fbink
