# KindleRDP display settings. Scale and gamma are also on the Settings screen of the app;
# the app rewrites only the line it changes. Remove the leading # to set a value by hand.
# Servers and passwords are managed in the app itself (Add / Edit on the server list).

# Windows display scaling in percent. 200 suits the 300 dpi panel.
# scale = 200
# Above 1 darkens mid-grays, so pale Windows borders and text stay visible (0.5-3.0).
# gamma = 1.0
# Full path of the fbink tool if it is not found automatically.
# fbink = /mnt/us/libkh/bin/fbink
